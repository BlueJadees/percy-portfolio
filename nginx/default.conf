server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el .wasm de Godot pesa 36 MB crudo y ~9 MB con gzip.
    # application/wasm no viene en la lista por defecto, hay que sumarlo.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Rutas normales
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Juegos HTML5 embebidos (Godot export).
    # ^~ evita que la regla de cache por extensión de abajo capture sus .js/.wasm/.pck.
    # COOP/COEP solo son obligatorios en builds con hilos; se dejan por si un juego futuro los usa.
    # no-cache = revalida con ETag (304 barato): al subir una build nueva, el .wasm y el .pck
    # viejos no quedan mezclados en caché con los nuevos (mismos nombres de archivo).
    location ^~ /assets/games/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|wasm|pck)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
